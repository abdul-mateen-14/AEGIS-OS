name: Shell CI

on:
  push:
    branches: [main]
    paths: ['shell/**', 'aegis-rs/**', '.github/workflows/shell-ci.yml']
  pull_request:
    paths: ['shell/**', 'aegis-rs/**']
  workflow_dispatch:

concurrency:
  group: shell-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deb:
    name: Build aegis-shell .deb (free ubuntu-latest runner)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: W62 weight lint — the bold budget
        run: python3 scripts/qml-weight-lint.py

      - name: Build inside ubuntu:resolute (Qt 6 + LayerShellQt)
        run: bash scripts/ci/run-in-container.sh bash scripts/build-shell.sh

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: aegis-shell-deb
          path: artifacts/*.deb
          retention-days: 14
          if-no-files-found: error

  rust-track:
    name: Rust track — island-core tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: cargo test (the behavior contract)
        working-directory: aegis-rs
        run: cargo test

      - name: clippy
        working-directory: aegis-rs
        run: cargo clippy --all-targets -- -D warnings
