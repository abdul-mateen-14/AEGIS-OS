name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  build:
    name: Build release ISO
    uses: ./.github/workflows/iso.yml
    with:
      artifact_retention_days: 1
      iso_version: ${{ github.ref_name }}
      # The ISO is split + hash-gated + published inside the build job
      # (iso.yml) — the 2.4 GB image never crosses a download-artifact
      # boundary, which silently truncated it in earlier attempts.
      release_tag: ${{ github.ref_name }}
    secrets: inherit
