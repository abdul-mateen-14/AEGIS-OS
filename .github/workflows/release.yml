name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  build:
    name: Build release ISO
    uses: ./.github/workflows/iso.yml
    with:
      artifact_retention_days: 1

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: aegis-os-${{ github.sha }}
          path: dist

      - name: Publish release (ISO + sha256)
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
        # Uses the repository secret AEGIS_TOKEN when present (repo Settings →
        # Secrets and variables → Actions), otherwise falls back to the
        # ephemeral, auto-provisioned GITHUB_TOKEN — CI works out of the box.
        env:
          GITHUB_TOKEN: ${{ secrets.AEGIS_TOKEN || secrets.GITHUB_TOKEN }}
