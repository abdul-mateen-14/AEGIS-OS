name: Boot Test

# Boots the published release ISO on the runner (KVM when available),
# drives the shell over QMP and captures screenshots: silent boot timeline,
# home desktop, Files, Terminal, Settings and Control Center.
# Results are preserved three ways: workflow artifacts, a commit to
# docs/screenshots/<tag>/ and a zip attached to the release itself.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to boot-test (empty = latest)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: boot-test
  cancel-in-progress: true

jobs:
  boot:
    name: Boot ISO and capture screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(curl -s "https://api.github.com/repos/${{ github.repository }}/releases/latest" \
              | python3 -c "import json,sys;print(json.load(sys.stdin)['tag_name'])")
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Boot-testing: $TAG"

      - name: Install QEMU + Pillow
        run: |
          # DNS guard — the 2026-11-11 v0.6.27 boot tests hung 45 min inside
          # apt on the runner's stub resolver (the same drift that broke the
          # ISO build container). Break the stub symlink, pin the two public
          # resolvers, and give apt hard retries with an index verdict.
          sudo rm -f /etc/resolv.conf
          printf "nameserver 1.1.1.1\nnameserver 8.8.8.8\n" | sudo tee /etc/resolv.conf >/dev/null
          for attempt in 1 2 3; do
            sudo apt-get update -qq || true
            apt-cache show qemu-system-x86 >/dev/null 2>&1 && break
            echo "archive indexes unavailable (attempt $attempt), retrying in 10 s"
            sleep 10
            [ "$attempt" = 3 ] && exit 1
          done
          sudo apt-get install -y -qq qemu-system-x86 >/dev/null
          qemu-system-x86_64 --version | head -1
          # KVM exists on public-repo runners but is often root-only; make it
          # usable so the boot runs in minutes instead of ~30. The capture
          # script still falls back to TCG automatically if this fails.
          sudo chmod 666 /dev/kvm 2>/dev/null || true
          ls -la /dev/kvm || echo "no /dev/kvm — TCG fallback"
          pip install -q pillow pycdlib

      - name: Download, reassemble and verify ISO
        run: |
          TAG="${{ steps.tag.outputs.tag }}"; VER="${TAG#v}"
          BASE="https://github.com/${{ github.repository }}/releases/download/$TAG"
          mkdir -p iso && cd iso
          # asset downloads occasionally return a challenged/empty body —
          # validate every file and retry before trusting it
          for i in 1 2 3; do
            curl -sL --retry 3 -o SHA256SUMS "$BASE/SHA256SUMS"
            grep -qE '^[0-9a-f]{64} ' SHA256SUMS && break
            echo "SHA256SUMS invalid (attempt $i):"; head -c 200 SHA256SUMS; echo; sleep 8
          done
          grep -qE '^[0-9a-f]{64} ' SHA256SUMS || { echo "::error::SHA256SUMS still invalid"; exit 1; }
          for P in part-00 part-01; do
            for i in 1 2 3; do
              curl -sL --retry 3 -O "$BASE/AegisOS-$VER-amd64.iso.$P"
              [ "$(stat -c%s "AegisOS-$VER-amd64.iso.$P" 2>/dev/null || echo 0)" -gt 100000000 ] && break
              echo "part $P too small (attempt $i), retrying"; sleep 8
            done
            [ "$(stat -c%s "AegisOS-$VER-amd64.iso.$P" 2>/dev/null || echo 0)" -gt 100000000 ] \
              || { echo "::error::part $P still incomplete"; exit 1; }
          done
          cat "AegisOS-$VER-amd64.iso.part-00" "AegisOS-$VER-amd64.iso.part-01" > AegisOS.iso
          sha256sum -c SHA256SUMS

      - name: Boot and capture
        run: |
          python3 scripts/boot-capture.py iso/AegisOS.iso screenshots

      - name: VMware boot variant (W41)
        # T15-D1 — the second hypervisor family. The main capture above is
        # earned on virtio; the user demos on VMware (vmwgfx). QEMU's
        # vmware-svga device makes the guest load vmwgfx and plymouthd must
        # paint there too — the user's Screenshot (23).png console flood is
        # exactly the headless-plymouthd failure this gate re-derives in CI.
        run: |
          python3 scripts/boot-capture.py iso/AegisOS.iso screenshots-vmware --vmware-boot-check

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-test-${{ steps.tag.outputs.tag }}
          path: |
            screenshots/**
            screenshots-vmware/**
            serial.log
            serial-diag.txt
            qemu.log
          retention-days: 90
          if-no-files-found: warn

      - name: Commit screenshots to the repo
        if: success()
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          git config user.name "aegis-ci"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p "docs/screenshots/$TAG"
          cp screenshots/*.png "docs/screenshots/$TAG/" 2>/dev/null || true
          for f in screenshots-vmware/*.png; do
            [ -f "$f" ] && cp "$f" "docs/screenshots/$TAG/vm-$(basename "$f")"
          done
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "no new screenshots to commit"
          else
            git commit -m "docs(screenshots): boot-test captures for $TAG"
            # T11-D6: main moves under us while this job runs (plan docs
            # land mid-flight) and the checkout is minutes old — rebase
            # on top of origin/main before pushing, or the capture push
            # is rejected (v0.6.33 run 43134801060 died exactly there).
            git pull --rebase origin main
            git push
          fi

      - name: Attach screenshots zip to the release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          (cd screenshots && zip -q "../AegisOS-$TAG-screenshots.zip" *.png)
          gh release upload "$TAG" "AegisOS-$TAG-screenshots.zip" \
            --clobber --repo "${{ github.repository }}"
          echo "screenshots zip attached to release $TAG"
