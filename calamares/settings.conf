# Aegis OS — Calamares settings (graphical installer, proposal Table 19)
modules-search: [ local ]

instances:
    - id: remove-live-autologin
      module: shellprocess

sequence:
    - show:
        - welcome
        - locale
        - keyboard
        - partition
        - users
        - summary
    - exec:
        - partition
        - mount
        - unpackfs
        - machineid
        - fstab
        - locale
        - keyboard
        - localecfg
        - users
        - displaymanager
        - networkcfg
        - hwclock
        - services-systemd
        - grubcfg
        - bootloader
        - shellprocess@remove-live-autologin
        - umount
    - show:
        - finish

branding: aegis
prompt-install: true
dont-chroot: false
disable-cancel: false
# Apple-grade guardrail: once installation starts, there is no Cancel —
# a half-installed system is the one thing a non-technical user cannot undo.
disable-cancel-during-exec: true
