# Calamares user setup for Aegis OS
---
defaultGroups:
    - name: users
      mustBeFirst: false
    - name: adm
    - name: cdrom
    - name: sudo
    - name: dip
    - name: plugdev
    - name: lpadmin
    - name: netdev
    - name: video
    - name: audio

autologinGroup: autologin
doAutologin: false

sudoersGroup: sudo
setRootPassword: false

# Aegis ID account avatar (M2): the rail reads /usr/share/aegis/avatar/
avatarFilePath: /usr/share/aegis/avatar/avatar-alex.png

hostname:
    location: EtcFile
    template: "aegis-%1"
    allowedLaptopHostnames: []
