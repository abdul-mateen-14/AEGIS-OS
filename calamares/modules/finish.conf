# Calamares finish page
---
restartNowEnabled: true
restartNowChecked: true
restartNowMode: user-checked
# T15-D9.2 (W46.2) — restart ejects the live medium from the guest side
# before rebooting (the VMware restart trap: ISO still attached + CD-first
# order = firmware falls to the empty disk).
restartNowCommand: "/usr/bin/aegis-install-finish"
