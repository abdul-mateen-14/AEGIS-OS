# Calamares finish page
#
# W84 — the user's ISO hit "Calamares Initialization Failed:
# finish@finish could not be loaded". The config carried the two
# DEPRECATED keys (restartNowEnabled, restartNowChecked) that
# resolute's newer Calamares schema-checks reject at LOAD time — the
# module never started and the installer rendered its failure dialog.
# The modern schema needs only restartNowMode + restartNowCommand
# (restartNowChecked was the old pre-tick for user-checked mode).
# T15-D9.2 (W46.2) — restart ejects the live medium from the guest
# side before rebooting (the VMware restart trap: ISO still attached +
# CD-first order = firmware falls to the empty disk — the same trap
# the user's PXE screenshot proved for the CC Restart, which now rides
# the same command).
---
restartNowMode: user-checked
restartNowCommand: "/usr/bin/aegis-install-finish"
