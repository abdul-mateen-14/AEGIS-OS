# Calamares shellprocess: the preseeded user-places.xbel ships with the live
# user's paths (/home/aegis). The installed system's user picks their own name
# at install time — rewrite the paths in /etc/skel AND copy the fixed file
# into the just-created user's home (users module already copied skel).
---
dontChroot: false
timeout: 30
script:
    - "u=$(awk -F: '$3>=1000 && $3<60000 {u=$1} END {print u}' /etc/passwd); if [ -n \"$u\" ]; then sed -i \"s|/home/aegis|/home/$u|g\" /etc/skel/.local/share/user-places.xbel; mkdir -p /home/$u/.local/share; cp /etc/skel/.local/share/user-places.xbel /home/$u/.local/share/user-places.xbel; chown $u:$u /home/$u/.local/share/user-places.xbel; fi"
