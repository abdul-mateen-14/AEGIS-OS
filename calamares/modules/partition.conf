# Calamares partitioning defaults for Aegis OS
---
efiSystemPartition: "/boot/efi"
efiSystemPartitionSize: 512MiB
efiSystemPartitionName: "EFI"

userSwapChoices:
    - none      # zram is the default (Table 19)
    - file      # swapfile for hibernation seekers

defaultFileSystemType: "ext4"

# availableFileSystemTypes: leave defaults (ext4, btrfs, xfs…)
