# Calamares packages module — remove the installer itself from the target
# system. Everything else ships in the squashfs already (drivers are built
# in per Table 22). Without this, a finished install keeps a clickable
# "Install Aegis OS" icon and calamares on disk — a one-click footgun for
# the non-technical users this OS is built for. os-prober stays: the
# installed grub.cfg needs it for dual-boot menus.
---
backend: apt
operations:
    - remove:
        - calamares

