# Calamares unpackfs — source is the casper live medium.
# Modern casper mounts the medium at /run/live/medium; /cdrom is the legacy
# symlink. If the ISO fails at this stage, adjust source to "/cdrom/live/
# filesystem.squashfs".
---
source: "/run/live/medium/live/filesystem.squashfs"
sourcefs: "squashfs"
destination: ""
excludeFile: "/etc/udev/rules.d/70-persistent-net.rules"
