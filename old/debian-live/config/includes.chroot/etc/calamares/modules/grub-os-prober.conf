# T19 — dual-boot menu entries. GRUB 2.06+ refuses to run os-prober
# unless GRUB_DISABLE_OS_PROBER=false is set in the target's
# /etc/default/grub — without it an Aegis install next to Windows or
# another Linux boots straight into Aegis with NO other-OS entry, and
# the non-technical user this OS is built for has no recovery path.
# This step appends the opt-in BEFORE grubcfg/bootloader run their
# grub-mkconfig pass on the target.
---
dontChroot: false
timeout: 30
script:
    - "grep -q '^GRUB_DISABLE_OS_PROBER=' /etc/default/grub && sed -i 's/^GRUB_DISABLE_OS_PROBER=.*/GRUB_DISABLE_OS_PROBER=false/' /etc/default/grub || printf '\\nGRUB_DISABLE_OS_PROBER=false\\n' >> /etc/default/grub"
