# Calamares bootloader — GRUB 2, EFI first (T19: modernized for the
# Calamares 3.3 module schema resolute ships). The old Arch-style
# kernel/img/fallback paths (/boot/vmlinuz-linux) point at files that
# DO NOT EXIST on an Ubuntu target — on 3.3 the module discovers the
# kernel through kernelSearchPath + kernelPattern against
# /usr/lib/modules instead, which is what an installed Aegis OS has.
---
efiBootLoader: "grub"
kernelSearchPath: "/usr/lib/modules"
kernelPattern: "^vmlinuz.*"
installEFIFallback: true
timeout: "10"
kernelLine: ", with Aegis OS"
fallbackKernelLine: ", with Aegis OS (fallback)"
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
