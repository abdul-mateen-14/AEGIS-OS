# Aegis OS — GRUB configuration for UEFI boot (El Torito + ESP).
# The signed grubx64.efi uses prefix /boot/grub, so it reads this file and
# its modules from /boot/grub/ on the ISO9660 filesystem. A copy also lives
# inside the ESP (efiboot.img ::/EFI/boot/grub.cfg) as prefix-fail fallback.
#
# The kernel append line mirrors --bootappend-live in debian-live/auto/config
# (includes.binary files are copied verbatim — no live-build substitution).

set default="0"
# 5 s: the W41 vmware report ("boot menu buttons doesn't work it just
# auto boots") — at 1 s the menu flashed past before the VM console ever
# took keyboard focus, so the recovery entries were unreachable. 5 s is
# short enough not to tax a demo, long enough to arrow down and Enter.
set timeout="5"

if loadfont /boot/grub/fonts/unicode.pf2 ; then
    set gfxmode=auto
    insmod all_video
    insmod gfxterm
    insmod png
    terminal_output gfxterm
    set menu_color_normal=white/black
    set menu_color_highlight=black/white
else
    terminal_input console
    terminal_output console
fi

menuentry "Start Aegis OS" --class aegis --class os {
    search --no-floppy --set=root --file /live/vmlinuz
    # W41 report 1 — the v0.6.72 console order: ttyS0 first so the
    # kernel still mirrors every line to CI's serial, tty1 LAST so
    # /dev/console (systemd's output) lands on the SCREEN: when the
    # splash fails on a real VMware stack or a weak laptop GPU the
    # boot text is visible instead of silent black.
    linux /live/vmlinuz boot=live quiet splash vt.global_cursor_default=0 console=ttyS0,115200n8 console=tty1 loglevel=3 plymouth.ignore-serial-consoles plymouth.debug=file:/run/plymouth-boot-debug.log hostname=aegis username=aegis autologin
    initrd /live/initrd.img
}

menuentry "Start Aegis OS (verbose — boot diagnostics)" --class aegis --class os {
    search --no-floppy --set=root --file /live/vmlinuz
    # W41 vmware report: splash renders black on some VMware stacks and
    # the user cannot tell boot from a hang. This entry drops quiet and
    # splash: every KMS/plymouth/systemd line is on the console, so a
    # stalled VM names its stage. Keep ttyS0 for CI capture.
    linux /live/vmlinuz boot=live vt.global_cursor_default=1 console=tty1 console=ttyS0,115200n8 loglevel=7 hostname=aegis username=aegis autologin
    initrd /live/initrd.img
}

menuentry "Start Aegis OS (no splash — visible boot text)" --class aegis --class os {
    search --no-floppy --set=root --file /live/vmlinuz
    # W41 report 1 — the guaranteed-visible path: plymouth.enable=0
    # keeps plymouthd off the display entirely and the dropped quiet
    # leaves every kernel/systemd line on tty1, so boot can never be a
    # silent black screen. Use when the splash blacks out in VMware or
    # on a simple laptop; pair with the compatibility entry for GPUs.
    linux /live/vmlinuz boot=live vt.global_cursor_default=1 console=ttyS0,115200n8 console=tty1 loglevel=4 plymouth.enable=0 hostname=aegis username=aegis autologin
    initrd /live/initrd.img
}

menuentry "Start Aegis OS (compatibility mode)" --class aegis --class os {
    search --no-floppy --set=root --file /live/vmlinuz
    linux /live/vmlinuz boot=live quiet splash vt.global_cursor_default=0 console=ttyS0,115200n8 console=tty1 loglevel=3 nomodeset plymouth.ignore-serial-consoles plymouth.debug=file:/run/plymouth-boot-debug.log hostname=aegis username=aegis autologin
    initrd /live/initrd.img
}
