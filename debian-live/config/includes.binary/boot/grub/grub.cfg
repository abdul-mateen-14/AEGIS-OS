# Aegis OS — GRUB configuration for UEFI boot (El Torito + ESP).
# The signed grubx64.efi uses prefix /boot/grub, so it reads this file and
# its modules from /boot/grub/ on the ISO9660 filesystem. A copy also lives
# inside the ESP (efiboot.img ::/EFI/boot/grub.cfg) as prefix-fail fallback.
#
# The kernel append line mirrors --bootappend-live in debian-live/auto/config
# (includes.binary files are copied verbatim — no live-build substitution).

set default="0"
# 1 s: the menu exists for recovery engineers, everyone else never sees
# more than a flash of it before the splash takes over.
set timeout="1"

if loadfont /boot/grub/fonts/unicode.pf2 ; then
    set gfxmode=auto
    insmod all_video
    insmod gfxterm
    insmod png
    terminal_output gfxterm
    set menu_color_normal=white/black
    set menu_color_highlight=black/white
else
    terminal_input console
    terminal_output console
fi

menuentry "Start Aegis OS" --class aegis --class os {
    search --no-floppy --set=root --file /live/vmlinuz
    linux /live/vmlinuz boot=live quiet splash vt.global_cursor_default=0 loglevel=3 plymouth.debug=file:/run/plymouth-boot-debug.log hostname=aegis username=aegis autologin
    initrd /live/initrd.img
}

menuentry "Start Aegis OS (compatibility mode)" --class aegis --class os {
    search --no-floppy --set=root --file /live/vmlinuz
    linux /live/vmlinuz boot=live quiet splash vt.global_cursor_default=0 loglevel=3 nomodeset plymouth.debug=file:/run/plymouth-boot-debug.log hostname=aegis username=aegis autologin
    initrd /live/initrd.img
}
