# Aegis OS — UEFI boot menu (custom template; live-build substitutes
# @KERNEL@ / @INITRD@ / @LB_BOOTAPPEND_LIVE@ / @LB_BOOTAPPEND_FAILSAFE@).
set default="0"
set timeout="1"

# Graphics: gfxterm with the bundled unicode font, Aegis splash behind the menu.
if loadfont /boot/grub/fonts/unicode.pf2 ; then
    set gfxmode=auto
    insmod all_video
    insmod gfxterm
    insmod png
    terminal_output gfxterm
    if background_image /boot/grub/splash.png ; then
        set menu_color_normal=white/black
        set menu_color_highlight=black/white
    else
        set menu_color_normal=white/black
        set menu_color_highlight=black/light-gray
    fi
else
    terminal_input console
    terminal_output console
fi

menuentry "Start Aegis OS" --class aegis --class os {
    linux @KERNEL@ @LB_BOOTAPPEND_LIVE@
    initrd @INITRD@
}

menuentry "Start Aegis OS (compatibility mode)" --class aegis --class os {
    linux @KERNEL@ @LB_BOOTAPPEND_LIVE@ @LB_BOOTAPPEND_FAILSAFE@
    initrd @INITRD@
}
