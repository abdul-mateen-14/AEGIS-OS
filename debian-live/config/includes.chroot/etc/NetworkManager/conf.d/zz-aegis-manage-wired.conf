# T15-D6 (W43) — the live session must MANAGE ethernet. The stock
# network-manager live packaging ships 10-globally-managed-devices.conf
# (unmanaged-devices = everything except wifi/gsm/cdma) which left the VM's
# NAT ethernet "unmanaged" — the wired row had no Connected state to render
# and the W43 boot gate red-lined it (run 3: ens4 carrier 1, NM unmanaged).
# This file sorts LAST in conf.d and resets the list: manage every device.
[keyfile]
unmanaged-devices=
