// Build-chroot-only apt policy (removed again by live-build at chroot
// teardown — it never reaches the shipped image).
//
// The local aegis-shell repository (file:/root/packages) is unsigned because
// --apt-secure false skips the GPG signing the minimal bootstrap cannot do
// (no gpg binary). resolute's apt 3.x no longer honors the legacy
// APT::Get::AllowUnauthenticated that live-build 3.0~a57 writes, so the
// modern option must be set explicitly here.
Acquire::AllowInsecureRepositories "true";
APT::Get::AllowUnauthenticated "true";
