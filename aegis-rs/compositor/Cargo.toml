[package]
name = "aegis-compositor"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "The AEGIS Wayland compositor — Rust, built on Smithay."

[dependencies]
smithay = { git = "https://github.com/Smithay/smithay", rev = "46643d204d61eef18bfb17faa814559af70504ed", default-features = false, features = ["backend_winit", "renderer_gl", "wayland_frontend"] }
winit = "=0.31.0-beta.4"
wayland-server = "0.31.13"
wayland-protocols = { version = "0.32.13", features = ["server"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
